name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_local_only
          POSTGRES_DB: crm
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.1-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_MODE: demo
      DATABASE_URL: postgresql://crm:crm_local_only@127.0.0.1:55432/crm
      TEST_DATABASE_URL: postgresql://crm:crm_local_only@127.0.0.1:55432/crm
      REDIS_URL: redis://127.0.0.1:56379
      TEST_REDIS_URL: redis://127.0.0.1:56379/15
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      COOKIE_SECURE: 'false'
      META_APP_SECRET: ci-meta-secret
      META_VERIFY_TOKEN: ci-verify-token
      AMO_CHAT_SECRET: ci-chat-secret
      API_INTERNAL_URL: http://127.0.0.1:4100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Real services (SeaweedFS S3 + ClamAV)
        run: |
          docker run -d --name seaweedfs -p 58333:8333 -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" chrislusf/seaweedfs:3.97 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=256
          docker run -d --name clamav -p 53310:3310 clamav/clamav:1.4.3
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:58333 && break; sleep 2; done
          for i in $(seq 1 90); do docker exec clamav clamdcheck.sh >/dev/null 2>&1 && break; sleep 5; done
          STORAGE_DRIVER=s3 S3_ENDPOINT=http://127.0.0.1:58333 S3_BUCKET=crm-files-test S3_ACCESS_KEY_ID=crm_local_access S3_SECRET_ACCESS_KEY=crm_local_secret_only_for_dev npm run storage:init
          npm run test:services
      - run: npm run build
      - name: E2E
        run: |
          npm run db:migrate
          npm run db:seed
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
