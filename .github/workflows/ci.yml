name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_local_only
          POSTGRES_DB: crm
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.1-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_MODE: demo
      DATABASE_URL: postgresql://crm:crm_local_only@127.0.0.1:55432/crm
      TEST_DATABASE_URL: postgresql://crm:crm_local_only@127.0.0.1:55432/crm
      REDIS_URL: redis://127.0.0.1:56379
      TEST_REDIS_URL: redis://127.0.0.1:56379/15
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      COOKIE_SECURE: 'false'
      META_APP_SECRET: ci-meta-secret
      META_VERIFY_TOKEN: ci-verify-token
      AMO_CHAT_SECRET: ci-chat-secret
      API_INTERNAL_URL: http://127.0.0.1:4100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: E2E
        run: |
          npm run db:migrate
          npm run db:seed
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
