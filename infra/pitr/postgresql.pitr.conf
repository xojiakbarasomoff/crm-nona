# PostgreSQL settings for point-in-time recovery (TZ §22.3: RPO ≤ 15 min, RTO ≤ 4 h).
# Production: replace archive_command with an off-site, encrypted target (e.g. wal-g/pgBackRest to
# object storage) or use a managed PostgreSQL with PITR enabled. archive_timeout bounds RPO.
listen_addresses = '*'
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
archive_timeout = 300            # force a WAL segment switch at least every 5 minutes
max_wal_senders = 5
wal_keep_size = 512MB
