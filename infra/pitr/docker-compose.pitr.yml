# Local PITR drill stack: primary with WAL archiving to a named volume, plus base backups.
# This proves the procedure; it is NOT an off-site production backup.
name: turizm-crm-pitr
services:
  pg-primary:
    image: postgres:16.4-alpine
    environment: { POSTGRES_USER: crm, POSTGRES_PASSWORD: crm_local_only, POSTGRES_DB: crm }
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    volumes:
      - ./postgresql.pitr.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - pitr_data:/var/lib/postgresql/data
      - pitr_wal:/wal-archive
      - pitr_base:/base-backups
    ports: ["127.0.0.1:55433:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U crm -d crm"], interval: 3s, timeout: 3s, retries: 30 }
volumes:
  pitr_data:
  pitr_wal:
  pitr_base:
